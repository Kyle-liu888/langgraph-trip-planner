[project]
name = "langgraph-trip-planner-backend"
version = "2.0.0"
description = "Model-agnostic LangGraph travel planning API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "langchain>=1.1,<2.0",
  "langchain-deepseek>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langgraph>=1.1,<2.0",
  "langgraph-checkpoint-postgres>=3.0,<4.0",
  "sqlalchemy[asyncio]>=2.0,<3.0",
  "alembic>=1.14,<2.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "argon2-cffi>=25.1,<26.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "python-dateutil>=2.9,<3.0",
  "requests>=2.32,<3.0",
  "uvicorn[standard]>=0.36,<1.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0,<2.0"]
google = ["langchain-google-genai>=2.0,<5.0"]
ollama = ["langchain-ollama>=1.0,<2.0"]

[dependency-groups]
dev = [
  "aiosqlite>=0.20,<1.0",
  "langgraph-checkpoint-sqlite>=3.0,<4.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
