[project]
name = "langgraph-trip-planner-backend"
version = "2.0.0"
description = "Model-agnostic LangGraph travel planning API"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "langchain>=1.1,<2.0",
  "langchain-deepseek>=1.0,<2.0",
  "langchain-openai>=1.0,<2.0",
  "langgraph>=1.0,<2.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "python-dateutil>=2.9,<3.0",
  "requests>=2.32,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0,<2.0"]
google = ["langchain-google-genai>=2.0,<5.0"]
ollama = ["langchain-ollama>=1.0,<2.0"]

[dependency-groups]
dev = [
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
